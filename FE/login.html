<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — P Care</title>
    <link rel="stylesheet" href="global.css" />
  </head>
  <body data-page="login">
    <div class="login-wrap layout" style="display: block">
      <div class="login-top">
        <button type="button" class="btn btn-sm" data-theme-toggle>
          <svg
            class="icon-sm icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
          <svg
            class="icon-sm icon-sun hidden"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
          <span class="theme-label mono">Mode gelap</span>
        </button>
      </div>

      <main class="login-main">
        <div class="login-box">
          <div class="login-head">
            <h1>Log In</h1>
            <p>P Care</p>
          </div>

          <form id="loginForm" class="login-form" novalidate>
            <label for="userInput">User</label>
            <input
              id="userInput"
              name="username"
              type="text"
              class="input"
              autocomplete="username"
              placeholder="Nama pengguna"
            />
            <p id="userError" class="err hidden">Nama pengguna wajib diisi.</p>

            <label for="passInput" class="gap">Password</label>
            <div class="input-wrap">
              <input
                id="passInput"
                name="password"
                type="password"
                class="input"
                autocomplete="current-password"
                placeholder="Kata sandi"
              />
              <button
                type="button"
                id="togglePass"
                aria-label="Tampilkan kata sandi"
              >
                <svg
                  id="eyeOpen"
                  class="icon-sm"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  id="eyeClosed"
                  class="icon-sm hidden"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                >
                  <path
                    d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 4.22-5.06M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  />
                  <path d="M1 1l22 22" />
                </svg>
              </button>
            </div>
            <p id="passError" class="err hidden">Kata sandi wajib diisi.</p>

            <p id="loginFormError" class="alert-err hidden">
              Nama pengguna atau kata sandi salah.
            </p>

            <button
              type="submit"
              id="submitBtn"
              class="btn btn-primary btn-block"
              style="margin-top: 24px"
            >
              <span id="submitLabel">Submit</span>
              <svg
                id="submitSpinner"
                class="icon-sm spin hidden"
                viewBox="0 0 24 24"
                fill="none"
              >
                <circle
                  cx="12"
                  cy="12"
                  r="9"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-opacity="0.3"
                />
                <path
                  d="M21 12a9 9 0 0 0-9-9"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </form>
        </div>
      </main>
    </div>

    <script src="global.js"></script>
    <script>
      PCare.init();

      const $ = (id) => document.getElementById(id);
      const passInput = $("passInput"),
        userInput = $("userInput");

      $("togglePass").addEventListener("click", () => {
        const show = passInput.type === "password";
        passInput.type = show ? "text" : "password";
        $("eyeOpen").classList.toggle("hidden", show);
        $("eyeClosed").classList.toggle("hidden", !show);
        $("togglePass").setAttribute(
          "aria-label",
          show ? "Sembunyikan kata sandi" : "Tampilkan kata sandi",
        );
      });

      /* Autentikasi: POST /api/auth/login → backend memeriksa hash di tabel `users` (SQLite) */
      function setFieldError(input, errorEl, show) {
        errorEl.classList.toggle("hidden", !show);
        input.classList.toggle("has-error", show);
      }

      $("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const formError = $("loginFormError");
        formError.classList.add("hidden");

        const username = userInput.value.trim();
        const password = passInput.value;
        setFieldError(userInput, $("userError"), !username);
        setFieldError(passInput, $("passError"), !password);
        if (!username || !password) return;

        const btn = $("submitBtn");
        btn.disabled = true;
        $("submitLabel").textContent = "Memeriksa…";
        $("submitSpinner").classList.remove("hidden");

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          if (!res.ok) {
            formError.textContent =
              res.status === 401
                ? "Nama pengguna atau kata sandi salah."
                : "Terjadi kendala saat masuk. Coba lagi.";
            formError.classList.remove("hidden");
            return;
          }
          window.location.href = "/";
        } catch (err) {
          formError.textContent =
            "Tidak dapat menghubungi server lokal. Periksa koneksi perangkat.";
          formError.classList.remove("hidden");
        } finally {
          btn.disabled = false;
          $("submitLabel").textContent = "Submit";
          $("submitSpinner").classList.add("hidden");
        }
      });

      userInput.addEventListener("input", () =>
        setFieldError(userInput, $("userError"), false),
      );
      passInput.addEventListener("input", () =>
        setFieldError(passInput, $("passError"), false),
      );
    </script>
  </body>
</html>
